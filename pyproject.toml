[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mission-control"
version = "0.1.0"
description = "Governed mission execution with Temporal and bounded agent cognition."
requires-python = ">=3.12"
dependencies = [
  "aioboto3>=15,<16",
  "asyncpg>=0.30,<1",
  "deepagents==0.7.5",
  "fastapi>=0.116,<1",
  "fastmcp==3.4.4",
  "httpx>=0.28,<1",
  "joserfc>=1.7.4",
  "langchain==1.3.14",
  "langchain-anthropic==1.5.4",
  "langchain-core==1.5.3",
  "langchain-mcp-adapters==0.3.1",
  "langchain-openai>=1.1,<1.4",
  "langchain-quickjs==0.3.5",
  "langgraph==1.2.10",
  "langgraph-api==0.12.0",
  "langgraph-checkpoint-postgres==3.1.1",
  "langgraph-cli[inmem]==0.4.31",
  "langgraph-runtime-inmem==0.32.0",
  "langgraph-sdk==0.4.2",
  "langsmith[pytest,sandbox]==0.10.15",
  "mcp==1.29.0",
  "openai>=2.36,<3",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings>=2.10,<3",
  "python-socketio>=5.13,<6",
  "redis>=6,<7",
  "supabase>=2.18,<3",
  "temporalio[opentelemetry]>=1.30,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
missionctl = "mission_control.interfaces.cli.main:main"

[dependency-groups]
biotech = ["biotech-mission-adapters==0.1.0"]
dev = [
  "httpx>=0.28,<1",
  "ipykernel>=7,<8",
  "jsonschema>=4.26.0",
  "jupyter>=1.1,<2",
  "mypy>=1.17,<2",
  "polars>=1.43.2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.uv.sources]
biotech-mission-adapters = { path = "integrations/biotech", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mission_control"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "integrations/biotech/src", "."]
markers = [
  "block_c_live: live Agent Server Block C qualification drills",
  "block_c_restart: Block C process-restart prepare/resume phases",
  "block_c_nn1: Block C N/N+1 compatibility drills",
  "block_c_nn1_deploy: two-endpoint N/N+1 deployment qualification drills",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/agent_server_block_c.py" = ["E501"]
"tests/unit/control_plane/test_digest_set_order_guard.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "mission_control.adapters.temporal.client"
disable_error_code = ["arg-type"]
