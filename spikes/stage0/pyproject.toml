[project]
name = "belllabs-stage0-qualification"
version = "0.0.0"
description = "Disposable Stage 0 LangGraph and Deep Agents qualification spikes."
requires-python = "==3.12.*"
dependencies = [
  "deepagents==0.7.4",
  "fastapi==0.141.1",
  "hypothesis==6.165.1",
  "langchain==1.3.14",
  "langchain-anthropic==1.5.3",
  "langchain-core==1.5.3",
  "langchain-mcp-adapters==0.3.1",
  "langchain-openai==1.4.1",
  "langchain-quickjs==0.3.5",
  "langgraph==1.2.10",
  "langgraph-checkpoint-postgres==3.1.1",
  "langgraph-cli[inmem]==0.4.31",
  "langgraph-sdk==0.4.2",
  "langsmith[pytest,sandbox]==0.10.15",
  "mcp==1.29.0",
  "psycopg[binary,pool]==3.3.4",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
